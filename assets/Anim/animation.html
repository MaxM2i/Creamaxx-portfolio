<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
        ::-webkit-scrollbar{
    display: none;
    }
        *, ::before, ::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Lobster', cursive;
    /* font-family: 'Pacifico', cursive; */
    font-weight: 400;
    }
    .fond{
        width: 100vw;
        height: 100vh;
        background-image: url(./img/combo_session_items_1400.jpg);
        background-size: cover;
        position: absolute;
        z-index: -1;
        filter: brightness(30%);
    }
    section {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        top: 0;
        left: 0;
    }
    img{
        width: 15vw;
        height: auto;
    }
    section >div{
        width: 60%;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        flex-wrap: wrap;
    }
        
    h1{
        /* text-transform: uppercase; */
        text-align: center;
        font-size: 7vh;
        color: #fff;
        margin-bottom: 5vh;
    }
    </style>
    
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <main>
        <div class="fond"></div>
        <section id="section1">
                <div><h1>L'expérience du portrait deluxe comprend :</h1></div>
            
                <div class="contain">
                    <div><img src="img/Coiffure.png" alt=""></div>
                    <div><img src="img/GardeRobe.png" alt=""></div>
                    <div><img src="img/Lieu.png" alt=""></div>
                    <div><img src="img/Paiement.png" alt=""></div>
                </div>
                <div class="contain">
                    <div><img src="img/Retouche.png" alt=""></div>
                    <div><img src="img/RevelChoix.png" alt=""></div>
                    <div><img src="img/satisfaction.png" alt=""></div>
                    <div><img src="img/Seance.png" alt=""></div>
                </div>
            
        </section>
    </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/ScrollTrigger.min.js"></script>
    <script>
       

        const TL = gsap.timeline({
            yoyo : true,
            repeat: -1, 
            repeatDelay: 3,
            /* scrollTrigger: {
                trigger: 'main',
                start: 'top top',
                end: 'bottom -200%',
                //markers: true,
                pin: true,
                scrub: 2,
                //snap: 1/(sections.length)
            } */
        });
        TL.from('.fond', {opacity: 0, duration: 2, /* rotate:360, */ scale:6})
            .from('#section1 h1', {y: '-25vh', opacity: 0, duration: 1 })
            .from('#section1 div div', {y: '30vh', opacity: 0, duration: 1, stagger:0.2 })
            /*  */
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Akaya+Telivigala&family=Antic+Slab&display=swap');

        *, ::before, ::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Antic Slab', serif;
        }
        a{
            color: inherit;
            text-decoration: none;
        }
        body{
            background-color: black;
            color: #f1f1f1;
        }
        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: linear-gradient(to bottom,
            rgb(80, 13, 80),rgba(238, 130, 238, 0));
        }
        nav img{
            width: 40px;
            height: auto;
        }
        nav a{
            display: inline-block;
            font-size: 1.2rem;
        }
        nav a:nth-child(-n+2){
            margin-right: 15px;
        }
        
        main video{
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            width: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(40%);
        }
        main section{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        main section h1{
            font-size: 8vh;
            margin-top: 20vh;
            text-align: center;
            text-transform: uppercase;
        }
        main section .middle-line{
            width: 1px;
            height: 30vh;
            border: 2px solid #f1f1f1;
            background-color: #f1f1f1;
            margin: 30px;
        }
        main section img{
            width: 80px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <img src="./assets/barrel.svg" alt="barril" class="logo barrel">
            <div class="container-nav">
                <a href="">ACCUEIL</a>
                <a href="">LE VIN</a>
                <a href="">CONTACT</a>
            </div>
            <img src="./assets/leaf.svg" alt="feuille" class="logo leaf">
        </nav>
    </header>
    <main>
        <video autoplay muted loop src="./assets/grappe-video.mp4"></video>
        <section>
            <h1>Des vignes d'exception</h1>
            <div class="middle-line"></div>
            <img src="./assets/grape.svg" alt="">
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.1/gsap.min.js"></script>
    <script>
        const TL = gsap.timeline();
        TL.from('main section h1', {autoAlpha: 0, y:-50, delay:1, })
            .from('main section .middle-line', {autoAlpha: 0, height: 0}, "-=0.2")
            .from('nav', {autoAlpha: 0, y:-100,  })
            .from('main section img', {autoAlpha: 0, y:-50, }, "-=0.7")
            .from('nav a', {autoAlpha: 0, y:-50, stagger: 0.2  })
            .from('nav img', {autoAlpha: 0, y:-50, }, "-=0.2")
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Akaya+Telivigala&family=Antic+Slab&display=swap');

        *, ::before, ::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* font-family: 'Antic Slab', serif; */
        }
        a{
            color: inherit;
            text-decoration: none;
        }
        
        .load-container{
            position: absolute;
            z-index: 100;
            width: 100%;
            height: 100vh;
            background-color: #e0b289;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .images-container{
            position: relative;
            width: 100%;
            height: 0;
        }
        .anim-bloc{
            width: 40vw;
            height: 60vh;
            position: relative;
        }
        .image{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .img1{
            background: url(./assets/image3.png);
            background-size: cover;
        }
        .img2{
            background: url(./assets/image1.jpg);
            background-size: cover;
        }
        .flip{
            background-color: #9b1339;
            height: 0;
        }
        .bloc-txt{
            position: absolute;
            bottom: -50px;
            left: -50px;
            background-color: #fff;
            height: 0;
            overflow: hidden;
        }
        .bloc-txt h2{
            padding: 10px 30px;
            color: #222;
            font-size:  40px;
            text-transform: uppercase;
            transform: translateY(100px);
        }
        .home{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .home video{
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            width: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(40%);
        }
        main section{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        main section h1{
            font-size: 8vh;
            margin-top: 5vh;
            text-align: center;
            text-transform: uppercase;
            color: #f1f1f1;
        }
        main section .middle-line{
            width: 1px;
            height: 30vh;
            border: 2px solid #f1f1f1;
            background-color: #f1f1f1;
            margin: 30px;
        }
        main section img{
            width: 80px;
        }
        .content button{
            padding: 15px 30px;
            background-color: transparent;
            text-transform: uppercase;
            font-size: 20px;
            border-radius: 5px;
            outline: none;
            border: 1px solid #f1f1f1;
            color: #f1f1f1;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="load-container">
        <div class="anim-bloc">
            <div class="images-container">
                <div class="image img1"></div>
                <div class="image img2"></div>
                <div class="image flip"></div>
            </div>
            <div class="bloc-txt">
                <h2>Adamo.</h2>
            </div>
        </div>
    </div>
    
    
    <main class="home">
        <video muted loop src="./assets/highendcooking.mp4"></video>
        <section class="content">
            <h1>Expérience Adamo</h1>
            <div class="middle-line"></div>
            <button>Explorez le menu</button>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script>
        const TL = gsap.timeline();
        TL.to('.images-container', {height: '100%', duration: 1.3, delay: 0.4 })
            .to('.bloc-txt', {height: 'auto', duration: 0.6}, "-=0.8")
            .to('.bloc-txt h2', {y: 0,}, "-=0.6")
            .to('.flip', {height: '100%', duration: 0.6, })
            .to('.img2', {display: 'none', duration: 0})
            .to('.flip', {height: '0', duration: 0.6, delay: .3})
            .to('.img1', {height: '0', duration: 0.6, delay: .3})
            .to('.load-container', {autoAlpha: 0, duration: 0.8, delay: 0.7})
            .add(()=> {
                document.querySelector('video').play();
            }, "-=0.8")
            .from('main section h1', {autoAlpha: 0, y:-150, delay:5, })
            .from('main section .middle-line', {autoAlpha: 0, height: 0}, "-=0.1")
            .from('.content button', {autoAlpha: 0, y:-50 }, "-=0.1")
            
        /* const TL = gsap.timeline();
        TL.from('main section h1', {autoAlpha: 0, y:-50, delay:1, })
            .from('main section .middle-line', {autoAlpha: 0, height: 0}, "-=0.2")
            .from('nav', {autoAlpha: 0, y:-100,  })
            .from('main section img', {autoAlpha: 0, y:-50, }, "-=0.7")
            .from('nav a', {autoAlpha: 0, y:-50, stagger: 0.2  })
            .from('nav img', {autoAlpha: 0, y:-50, }, "-=0.2") */
    </script>
</body>
</html>
